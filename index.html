<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>한 칸</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한 칸">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0C10">
<link rel="manifest" href="manifest.json">
<script>(function(){function fit(){var sa=navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);if(sa){var h=Math.max(screen.height,window.innerHeight);if(Math.abs(window.orientation||0)===90)h=Math.max(screen.width,window.innerHeight);document.documentElement.style.setProperty("--app-h",h+"px")}}fit();window.addEventListener("resize",fit);window.addEventListener("orientationchange",fit);document.addEventListener("visibilitychange",fit)})();</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F2F4F3;--surface:#FFFFFF;--ink:#16211D;--muted:#69776F;--line:#E1E6E3;--act:#2B45E8;--act-ink:#fff;--done:#1F7F53;--warm:#C98208;--soft:#E8ECFF;--zone:#DDF0E4;--m:#16A3B5;--s:#E89B00;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0B0C10;--surface:#17191F;--ink:#F2F3F5;--muted:#9A9FAB;--line:#262932;--act:#5B73FF;--act-ink:#FFFFFF;--done:#4CC38A;--warm:#F5B547;--soft:#20264A;--zone:#173326;--m:#1FB5C9;--s:#F0A71F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:175px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--act);background:var(--surface)}
textarea{resize:vertical}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px 10px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
.top .date{font-size:13px;color:var(--muted);font-weight:600}
.sync{font-size:11.5px;color:var(--muted);margin:-6px 2px 10px;line-height:1.5}
.sync b{color:var(--warm);font-weight:600}
.panel{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.2px}
h2 .n{color:var(--act);margin-left:4px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 15px;border-radius:12px;font-weight:700;background:var(--bg);white-space:nowrap;min-height:42px}
.btn.p{background:var(--act);color:var(--act-ink)}
.btn.s{padding:7px 12px;font-size:13.5px;border-radius:10px;min-height:36px}
.btn.g{background:transparent;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;font-size:13.5px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 선포 */
.decl{background:var(--act);color:var(--act-ink)}
.decl .l{font-size:12px;font-weight:700;opacity:.8}
.decl .t{font-size:19px;font-weight:800;margin-top:2px;word-break:keep-all;line-height:1.35}
/* 선포 한 줄 */
.decl{display:flex;gap:10px;align-items:center;padding:12px 16px}
.decl .l{font-size:18px;opacity:1}
.decl .t{flex:1;font-size:16px;font-weight:800;margin:0;word-break:keep-all;line-height:1.35}
/* 지금 이거 어때 */
.sug .lbl{font-size:12.5px;color:var(--muted);font-weight:700}
.sug .tt{font-size:19px;font-weight:800;margin-top:2px;word-break:keep-all;line-height:1.35}
.sgo{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.sgo .btn{min-height:50px;font-size:15px}
.sgo .btn.p{font-size:16px}
[data-pk]{cursor:pointer}
.medchip{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border-radius:99px;padding:2px 9px;margin-right:6px}
/* 오늘의 판 */
.pan .ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pan .pct{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.pan .pct small{font-size:16px;font-weight:700;letter-spacing:0;margin-left:6px}
.pan .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.pan .nums{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:13.5px}
.pan .nums i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;display:flex;margin:12px 0}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big2 .btn{min-height:50px;font-size:16px;border-radius:14px}
.btn.m{background:var(--m);color:#fff}.btn.sv{background:var(--s);color:#fff}
.salesin{display:flex;gap:6px;margin-top:8px}
.salesin input{flex:1;min-width:0}
.minor{display:flex;justify-content:space-between;margin-top:8px}
.minor button{font-size:12.5px;color:var(--muted);padding:4px 2px}
.tier-zero{color:var(--muted)}.tier-low{color:#C62828}.tier-mid{color:#B85C00}.tier-near{color:#4A7A00}.tier-ok{color:var(--done)}.tier-over{color:#B07400}
@media (prefers-color-scheme:dark){.tier-low{color:#FF7A6E}.tier-mid{color:#FFB25A}.tier-near{color:#A8D85C}.tier-over{color:#FFD15A}}
/* 지금 상태 */
.now{display:flex;flex-direction:column;gap:0;padding:4px 16px}
.now .ln{display:flex;align-items:center;gap:12px;padding:8px 0;min-height:48px}
.now .ln+.ln{border-top:1px solid var(--line)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--line)}
.dot.focus{background:var(--act)}.dot.break{background:var(--done)}.dot.check{background:var(--warm)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.stats b{display:block;font-size:22px;line-height:1.1}
ul.tl{list-style:none;padding:0;margin:6px 0 0}
ul.tl li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
ul.tl li:first-child{border-top:0}
ul.tl li .grow{white-space:pre-wrap}
.tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:86px;font-size:13px;padding-top:1px}
.grow{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--act);white-space:nowrap;font-weight:600}
.tag.g{background:var(--zone);color:var(--done)}
.tag.n{background:var(--bg);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type,.small+.item{border-top:0;padding-top:4px}
.item .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.item .acts .btn{padding:8px 0;font-size:13.5px;min-height:40px}
.edit{background:var(--bg);border-radius:14px;padding:10px;margin-top:6px}
.edit input,.edit select{background:var(--surface)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav button{width:44px;height:40px;border-radius:12px;background:var(--surface);font-weight:700}
.nav .d{flex:1;text-align:center;font-weight:800;font-size:16px}
.medrow{border-top:1px solid var(--line);padding:10px 0}
.medrow:first-child{border-top:0}
details.fold>summary{list-style:none;cursor:pointer;font-weight:700;display:flex;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:'펼치기';font-size:12px;color:var(--muted);font-weight:600}
details.fold[open]>summary:after{content:'접기'}
details.fold[open]>summary{margin-bottom:8px}
/* 아래: 아이디어 입력 + 탭 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgba(0,0,0,.05);padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.compose{max-width:560px;margin:0 auto;padding:10px 16px 14px}
.compose .cb{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.compose .cb span{font-size:11.5px;color:var(--muted);font-weight:600}
.compose select{width:auto;max-width:60%;font-size:13px;padding:4px 26px 4px 10px;border-radius:99px;background:var(--bg);min-height:30px;font-weight:600}
.compose .ci{display:flex;gap:8px;align-items:flex-end}
.compose #memoIn{flex:1;min-width:0;min-height:44px;max-height:132px;resize:none;line-height:22px;overflow-y:auto;display:block}
.compose input{flex:1;min-width:0;min-height:44px}
.compose .btn{min-height:44px}
.compose .picb{display:flex;align-items:center;justify-content:center;width:46px;padding:0;font-size:20px;background:var(--bg);flex:none;cursor:pointer}
.mpics{display:flex;gap:8px;margin-top:10px}.mp{position:relative;flex:none}.mp img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}
.mp .mf{display:flex;align-items:center;height:58px;max-width:170px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.3;overflow:hidden;word-break:break-all}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fchip{display:inline-block;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;border:0;padding:0;line-height:24px;text-align:center}
nav.tabs{display:flex;max-width:560px;margin:0 auto;border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:10px 0 6px;font-weight:700;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--act)}
nav.tabs .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#E5484D;color:#fff;font-size:10.5px;line-height:17px}
.toast{position:fixed;left:50%;bottom:185px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%}
.toast.show{opacity:1}
.phs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
img.ph{width:100%;border-radius:12px;background:var(--bg);min-height:80px;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.lb img{max-width:100%;max-height:100%}
/* 오늘의 고정 칸 */
.slots{padding:14px 14px 8px}
.slots.need{box-shadow:0 0 0 2px var(--act)}
.sl-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sl-head b{font-size:15px}
.sl-need{font-size:12.5px;color:var(--act);font-weight:600;margin:0 0 6px}
.sl-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 0;border-top:1px solid var(--line)}
.sl-row:first-of-type{border-top:0}
.sl-time{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:9px;padding:5px 9px;flex:none}
.sl-body{flex:1 1 120px;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-t{font-weight:700}.sl-b{font-size:11.5px;color:var(--muted)}
.sl-hint{font-size:10.5px;color:var(--warm);font-weight:700;border:1px solid var(--warm);border-radius:99px;padding:0 6px;margin-right:4px}
.sl-pick{font-size:14px;color:var(--act);border:1.5px dashed var(--act);border-radius:9px;padding:5px 10px;font-weight:600}
.sl-act{display:flex;gap:4px;align-items:center;margin-left:auto}
.sl-st{font-size:12.5px;font-weight:700}.sl-st.ok{color:var(--done)}.sl-st.run{color:var(--act)}.sl-st.miss{color:#C62828}
.s-due .sl-time{background:var(--act);color:#fff}
.s-missed .sl-time{background:#FDE8E6;color:#C62828}
.s-done .sl-time{background:var(--zone);color:var(--done)}
.s-done .sl-body,.s-pass .sl-body{opacity:.6}
.sl-list{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px}
.sl-list .opt{text-align:left;background:var(--bg);border-radius:11px;padding:10px 12px;font-size:14.5px}
.tag.pin{background:var(--soft);color:var(--act)}
/* 폰 칸 타이머 */
.timer{border:2px solid var(--act)}
.timer .lbl{font-size:12.5px;color:var(--act);font-weight:700}
.timer .tt{font-size:17px;font-weight:800;margin-top:2px;word-break:keep-all}
.timer .clock{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.timer.over{border-color:var(--warm)}
.timer.over .clock{color:var(--warm)}
.btn.go{background:var(--soft);color:var(--act)}
@media (min-width:1000px){ .wrap,.compose,nav.tabs{max-width:760px} }
@media (prefers-color-scheme:dark){
  input,select,textarea,.compose select{background:#23262E}
  input:focus,select:focus,textarea:focus{background:#2A2E37}
  .panel{box-shadow:none;border:1px solid #20232B}
  .dock{background:#13151A}
  .s-missed .sl-time{background:#3A1E1E;color:#FF8A80}
  .btn{background:#272B34}
  .btn.p{background:var(--act);color:#fff}.btn.g{background:transparent}
  .btn.m{background:var(--m);color:#fff}.btn.sv{background:var(--s);color:#fff}
  .seg{background:#23262E}.seg button[aria-pressed="true"]{background:#3A3F4C;color:#fff}
  .bar{background:#23262E}
  .tag.n{background:#23262E}
  .medchip{background:#23262E}
  .edit{background:#1F2229}
}
/* 화면 틀: 위 고정 · 가운데만 스크롤 · 아래 칸은 항상 바닥 (아이폰 홈 화면 앱의 fixed 버그 피함) */
html,body{height:100vh;height:100dvh;height:var(--app-h,100dvh);overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 0!important}
#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:16px}
.dock{position:relative!important;flex:none;left:auto;right:auto;bottom:auto}
.setup-host{overflow-y:auto}
.setup{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px}
.setup h1{font-size:24px;margin:0 0 8px}.setup p{color:var(--muted);font-size:14px;margin:0 0 16px}
.setup textarea{min-height:110px;font-size:16px}
.setup .btn{width:100%;margin-top:12px;min-height:48px}
</style>
</head>
<body>
<div id="scroller"><div class="wrap">
  <div class="top"><h1>한 칸</h1><span class="date" id="today"></span></div>
  <div class="sync" id="sync"></div>
  <main id="view"></main>
</div></div>
<div class="dock">
  <div class="compose" id="compose">
    <div class="cb"><span>💡 아이디어</span><select id="memoB" aria-label="브랜드"></select></div>
    <div class="ci"><textarea id="memoIn" rows="1" maxlength="500" placeholder="떠오른 거 바로 적기" autocomplete="off" enterkeyhint="enter"></textarea><label class="btn picb" aria-label="사진·파일 넣기" title="사진·파일 넣기">📎<input type="file" id="memoPic" multiple hidden></label><button class="btn p" data-a="memoAdd">적기</button></div>
    <div class="mpics" id="memoPics" hidden></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-t="today" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>오늘</button>
    <button role="tab" data-t="tasks" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>할 일</button>
    <button role="tab" data-t="memo" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg>메모 정리<span class="bd" id="memoBd" hidden></span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var CFG=null; try{CFG=JSON.parse(LS.get('hk_cfg')||'null')}catch(e){}
var API=CFG&&CFG.u, K=CFG&&CFG.k, D=null, NS=null;
function hkParse(t){var m=String(t||'').match(/(https:\/\/script\.google\.com\/[^\s?#]*\/exec)\?k=([A-Za-z0-9]+)/);return m?{u:m[1],k:m[2]}:null}
function hkFetch(cb){ if(!API)return; fetch(API+'?api=1&k='+encodeURIComponent(K)+'&t='+Date.now()).then(function(r){return r.json()}).then(function(r){
    if(!r||!r.ok){ if(r&&r.err==='secret')hkSetup('주소가 바뀌었어요. 한 칸 설정의 "폰용 주소"를 다시 붙여넣어 주세요.'); return; }
    LS.set('hk_data',JSON.stringify({d:r.data,n:r.notion})); cb(r.data||{},r.notion);
  }).catch(function(){ if(window.__hkToast)window.__hkToast('인터넷 연결을 확인해 주세요'); }); }
function hkSetup(msg){
  document.body.className='setup-host';document.body.innerHTML='<div class="setup"><h1>한 칸 연결</h1><p>'+(msg||'PC 한 칸 → 설정 → 폰·시트 동기화의 <b>폰용 주소</b>를 복사해서 아래에 붙여넣어 주세요. 처음 한 번만 하면 돼요.')+'</p><textarea id="cfgIn" placeholder="https://script.google.com/macros/s/.../exec?k=..."></textarea><button class="btn p" id="cfgGo">연결하기</button><p id="cfgMsg" style="margin-top:10px"></p></div>';
  document.getElementById('cfgGo').onclick=function(){ var c=hkParse(document.getElementById('cfgIn').value); if(!c){document.getElementById('cfgMsg').textContent='주소 모양이 아니에요. https://script.google.com/... 로 시작하는 걸 통째로 붙여넣어 주세요.';return}
    document.getElementById('cfgMsg').textContent='확인 중…';
    fetch(c.u+'?api=1&k='+encodeURIComponent(c.k)).then(function(r){return r.json()}).then(function(r){ if(!r||!r.ok){document.getElementById('cfgMsg').textContent='연결이 안 돼요. 주소를 다시 확인해 주세요. (구글 시트에서 Code.gs 새 버전 배포를 했는지도 봐 주세요)';return}
      LS.set('hk_cfg',JSON.stringify(c)); LS.set('hk_data',JSON.stringify({d:r.data,n:r.notion})); location.reload(); })
    .catch(function(){document.getElementById('cfgMsg').textContent='연결이 안 돼요. 인터넷이나 주소를 확인해 주세요.'}); };
}
function hkBoot(){
  if(!API){hkSetup();return}
  var c=null; try{c=JSON.parse(LS.get('hk_data')||'null')}catch(e){}

      return '<div class="item row"><div class="grow" data-pk="'+t.id+'"><div>'+esc(t.title)+'</div><div class="row" style="margin-top:3px">'+(t.dailyId?(t.optional?'<span class="tag" style="background:transparent;border:1px solid var(--warm);color:var(--warm)">선택</span>':'<span class="tag" style="background:var(--warm);color:#fff">매일 🔒</span>'):'')+kindTag(t.kind)+(t.brand?'<span class="tag n">'+esc(t.brand)+'</span>':'')+(s.length?'<span class="small muted">단계 '+dn+'/'+s.length+'</span>':'')+'</div></div>'
        +(function(){var pl=slPlaced(t.id);return pl?'<span class="tag pin">📌 '+esc(pl.t)+'</span>':'<button class="btn s g" data-a="slPin" data-id="'+t.id+'" aria-label="고정 칸에 넣기">📌</button>'})()+'<button class="btn s g" data-a="edOpen" data-id="'+t.id+'">수정</button></div>'}).join('')+'</div>'
      :'<p class="empty" style="margin-top:10px">남은 할 일이 없어요.</p>';
    if(snz) h+='<p class="small muted" style="margin:8px 0 0">내일로 미룬 것 '+snz+'개 (PC에서 관리)</p>';
    h+='<p class="small muted" style="margin:8px 0 0">할 일을 누르면 오늘 탭에서 바로 시작할 수 있어요.</p>';
    return h+'</section>';
  }
  function noteHTML(d){
    var v=D.notes[d]||'';
    return '<section class="panel"><h2>'+(d===TODAY?'오늘 한 줄':'그날 한 줄')+'</h2><p class="small muted" style="margin:-4px 0 8px">약 효과 체감, 부작용, 컨디션</p>'
      +'<textarea id="noteIn" rows="3" placeholder="예: 11시쯤부터 덜 산만, 4시 이후 흩어짐">'+esc(v)+'</textarea>'
      +'<div class="row" style="margin-top:8px"><button class="btn s p" data-a="noteSave" data-d="'+d+'">저장</button></div></section>';
  }
  function dayHTML(d){
    var bl=D.blocks.filter(function(b){return b.day===d}).sort(function(a,b){return a.start-b.start});
    var done=bl.filter(function(b){return b.result==='done'}).length, mins=bl.reduce(function(a,b){return a+b.minutes},0);
    var h='<section class="panel"><h2>한 칸들</h2>';
    h+= bl.length?'<div class="stats"><div><b>'+bl.length+'</b><span class="small muted">칸</span></div><div><b>'+done+'</b><span class="small muted">다 했어</span></div><div><b>'+(Math.floor(mins/60)?Math.floor(mins/60)+'시간 ':'')+(mins%60)+'분</b><span class="small muted">집중</span></div></div>'
      +'<ul class="tl">'+bl.map(function(b){return '<li><span class="tm">'+hm(b.start)+'–'+hm(b.end)+'</span><span class="grow">'+esc(b.title)+'</span><span class="small '+(b.result==='done'?'':'muted')+'">'+(b.result==='done'?'다 했어':'반쯤')+'</span></li>'}).join('')+'</ul>'
      :'<p class="empty">기록된 칸이 없어요.</p>';
    h+='</section>';
    var dn=D.tasks.filter(function(t){return t.done&&t.doneAt&&dayOf(t.doneAt)===d}).sort(function(a,b){return a.doneAt-b.doneAt});
    h+='<section class="panel"><h2>끝낸 할 일</h2>'+(dn.length?'<ul class="tl">'+dn.map(function(t){return '<li><span class="tm">'+hm(t.doneAt)+'</span><span class="grow">'+esc(t.title)+'</span>'+(t.brand?'<span class="tag n">'+esc(t.brand)+'</span>':'')+'</li>'}).join('')+'</ul>':'<p class="empty">없어요.</p>')+'</section>';
    var ms=D.memos.filter(function(m){return m.day===d}).sort(function(a,b){return a.at-b.at});
    var sl={later:'다시 보기',done:'할 일로',dropped:'버림',kept:'보관함'};
    h+='<section class="panel"><h2>떠오른 아이디어</h2>'+(ms.length?'<ul class="tl">'+ms.map(function(m){return '<li><span class="tm">'+hm(m.at)+'</span><span class="grow">'+esc(m.text)+photoBtn(m.imgs)+(m.ctx?'<br><span class="small muted">'+(m.ctx==='폰'?'폰에서':'"'+esc(m.ctx)+'" 하다가')+'</span>':'')+'</span>'+(m.bp&&m.brand?'<span class="tag">'+esc(m.brand)+'</span>':'')+(sl[m.status]?'<span class="tag n">'+sl[m.status]+'</span>':'')+'</li>'}).join('')+'</ul>':'<p class="empty">없어요.</p>')+'</section>';
    var ls=(D.lectures||[]).filter(function(l){return l.day===d});
    if(ls.length) h+='<section class="panel"><h2>강의 기록</h2>'+ls.map(function(l){return '<div class="item"><div style="font-weight:700">'+esc(l.title)+'</div><div style="white-space:pre-wrap;font-size:14px;margin-top:4px">'+esc(l.note)+'</div>'+photoBtn(l.imgs)+'</div>'}).join('')+'</section>';
    return h;
  }
  // 볼 때: 글 아래에 크게 바로 (화면 들어오면 자동으로 불러옴)
  var imgCache={};
  function hkImg(f,ok,bad){ fetch(API+'?api=img&k='+encodeURIComponent(K)+'&f='+encodeURIComponent(f)).then(function(r){return r.json()}).then(function(r){ if(r&&r.ok)ok(r.d); else bad(); }).catch(bad); }
  function photoBtn(ids){ ids=(ids||[]).filter(function(i){return (D.imgDrive||{})[i]}); if(!ids.length) return '';
    var FM=D.fileMeta||{}, fs=ids.filter(function(i){return FM[i]}); ids=ids.filter(function(i){return !FM[i]});
    var fh=fs.length?'<div class="fchips">'+fs.map(function(id){return '<a class="fchip" target="_blank" rel="noopener" href="https://drive.google.com/file/d/'+encodeURIComponent(D.imgDrive[id])+'/view">📄 '+esc(FM[id].n)+' · '+fsz(FM[id].s)+'</a>'}).join('')+'</div>':'';
    if(!ids.length) return fh;
    return fh+'<div class="phs">'+ids.map(function(id){return '<img class="ph" data-fid="'+D.imgDrive[id]+'" alt="첨부 이미지"'+(imgCache[D.imgDrive[id]]?' src="'+imgCache[D.imgDrive[id]]+'"':'')+'>'}).join('')+'</div>'; }
  function loadPhotos(){ Array.prototype.forEach.call(document.querySelectorAll('img.ph:not([src])'),function(im){ var f=im.getAttribute('data-fid'); if(im.dataset.req)return; im.dataset.req='1';
    hkImg(f,function(d){imgCache[f]=d;im.src=d},function(){im.alt='불러오기 실패'}); }); }

  function render(){
    drawSync(); document.body.className='t-'+tab;
    $('today').innerHTML=(D.med[TODAY]?'<button class="medchip" data-a="medEdit" title="약 시간 수정">💊 '+esc(D.med[TODAY])+'</button>':'')+esc(label(TODAY));
    var pm=pendingMemos().length, bd=$('memoBd'); bd.hidden=!pm; bd.textContent=pm;
    var v=$('view'), h='';
    if(tab==='today') h=timerHTML()+declHTML()+slotsHTML()+panHTML()+sugHTML()+nowHTML()+missionsHTML();
    else if(tab==='tasks') h=tasksHTML();
    else h=memoReviewHTML();
    v.innerHTML=h; loadPhotos();
    var aq=$('aq'); if(aq){ aq.oninput=function(){ window.__aq=aq.value; var p=aq.selectionStart; render(); var n=$('aq'); n.focus(); try{n.setSelectionRange(p,p)}catch(e){} }; }
    var gi=$('goalIn'); if(gi) gi.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();click('goalSave')}};
    var pi=$('panIn'); if(pi) pi.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();click('panS')}};
    var slt=$('slT'); if(slt){ slt.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();click('slTimeSave')}}; slt.focus(); }
    var ti=$('taskIn'); if(ti) ti.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();click('taskAdd')}};
  }
  // 아래 아이디어 입력칸 (화면 바뀌어도 그대로 유지)
  $('memoB').onchange=function(){
    var mb=$('memoB');
    if(mb.value!=='__new__'){memoBrand=mb.value;return}
    var n=String(prompt('새 브랜드 이름')||'').replace(/[,\n]/g,' ').replace(/\s+/g,' ').trim().slice(0,30);
    if(!n){drawCompose();return}
    memoBrand=n; if(brands.indexOf(n)<0)send('addBrand',{name:n},'"'+n+'" 브랜드 만들었어요'); drawCompose(); $('memoIn').focus(); };
  /* 엔터 = 줄바꿈, 저장은 「적기」 버튼. 줄이 늘면 칸도 커짐 (5줄까지, 그 뒤는 칸 안에서 스크롤) */
  function memoGrow(){ var t=$('memoIn'); if(!t)return; t.style.height='auto'; if(t.value) t.style.height=Math.min(t.scrollHeight+3,132)+'px' }
  $('memoIn').addEventListener('input',memoGrow);
  function setTabs(){Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(x){x.setAttribute('aria-selected',x.getAttribute('data-t')===tab?'true':'false')})}
  // 폰 칸 타이머: 1초마다 숫자만 갱신, 끝나는 순간 진동
  var buzzed=null;
  setInterval(function(){ var ps=D.psession, c=$('pClock'); if(!ps||!c)return; var left=ps.endAt-Date.now();
    if(left<=0&&buzzed!==ps.id){buzzed=ps.id; try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){} render(); return}
    c.textContent=left>0?mmss(left):'시간 끝!'; var sb=$('pSub'); if(sb)sb.textContent=left>0?hm(ps.endAt)+'까지':mmss(left)+' 지남 · 체크해 줘';
    var br=$('pBar'); if(br)br.style.width=Math.min(100,Math.max(0,(Date.now()-ps.startAt)/Math.max(1,ps.endAt-ps.startAt)*100))+'%'; },1000);
  function click(a){var b=document.querySelector('[data-a="'+a+'"]');if(b)b.click()}

  document.addEventListener('click',function(e){
    var pi=e.target.closest&&e.target.closest('img.ph'); if(pi&&pi.src){ var o=document.createElement('div'); o.className='lb'; o.innerHTML='<img alt="">'; o.firstChild.src=pi.src; o.onclick=function(){o.remove()}; document.body.appendChild(o); return; }
    var pk=e.target.closest&&e.target.closest('[data-pk]'); if(pk&&tab==='tasks'&&!e.target.closest('button')){ pick=pk.getAttribute('data-pk'); sugMin=null; tab='today'; setTabs(); render(); ($('scroller')||{}).scrollTop=0; return; }
    var b=e.target.closest('button'); if(!b)return; var a=b.getAttribute('data-a'), id=b.getAttribute('data-id');
    if(b.hasAttribute('data-min')&&!a){ sugMin=+b.getAttribute('data-min'); render(); return; }
    if(b.hasAttribute('data-t2')){ tab=b.getAttribute('data-t2'); setTabs(); render(); return; }
    if(b.hasAttribute('data-t')){tab=b.getAttribute('data-t');setTabs();if(tab==='hist')day=TODAY;editId=null;render();($('scroller')||{}).scrollTop=0;return}
    if(b.hasAttribute('data-go')){var g=b.getAttribute('data-go');if(g){day=g;render();($('scroller')||{}).scrollTop=0}return}
    if(b.hasAttribute('data-kind')){var tv=$('taskIn').value,bv=$('taskB').value;newKind=b.getAttribute('data-kind');render();$('taskIn').value=tv;$('taskB').value=bv;return}
    if(false){ var box=b.nextElementSibling; if(box.dataset.on){box.innerHTML='';delete box.dataset.on;b.textContent=b.textContent.replace('접기','보기');return}
      box.dataset.on='1'; b.textContent=b.textContent.replace('보기','접기');
      b.getAttribute('data-ids').split(',').forEach(function(id){ var im=document.createElement('img'); im.style.cssText='width:100%;border-radius:10px;margin-top:8px;background:var(--bg);min-height:60px'; im.alt='첨부 이미지'; box.appendChild(im);
        hkImg(D.imgDrive[id],function(d){im.src=d},function(){im.alt='불러오기 실패'}); });
      return; }
    switch(a){
      case 'slPick': slPick=slPick===b.getAttribute('data-sid')?'':b.getAttribute('data-sid'); slTimeEd=''; render(); break;
      case 'slPickClose': slPick=''; render(); break;
      case 'slFold': slOpen=!slOpen; slPick=''; slTimeEd=''; render(); break;
      case 'slSet': slPick=''; slPin(id,b.getAttribute('data-sid')); break;
      case 'slPin': slPin(id); break;
      case 'slClear': send('slotSet',{day:TODAY,id:b.getAttribute('data-sid'),taskId:null},'배치 뺐어요'); break;
      case 'slTime': slTimeEd=slTimeEd===b.getAttribute('data-sid')?'':b.getAttribute('data-sid'); slPick=''; render(); break;
      case 'slTimeClose': slTimeEd=''; render(); break;
      case 'slTimeSave': var sid1=b.getAttribute('data-sid'), tv1=($('slT')||{}).value||''; if(!tv1)break; var er1=slCheck(slOf(D,TODAY).map(function(x){return x.id===sid1?{t:tv1}:x})); if(er1){toast(er1);break} slTimeEd=''; send('slotTime',{day:TODAY,id:sid1,t:tv1},tv1+'로 옮겼어요'); break;
      case 'slDel': slTimeEd=''; send('slotDel',{day:TODAY,id:b.getAttribute('data-sid')},'자리를 뺐어요'); break;
      case 'slAdd': var L1=slOf(D,TODAY); if(L1.length>=SL_MAX){toast('고정 칸은 하루 '+SL_MAX+'개까지예요');break} var nt1=slNextFree(''); if(!nt1){toast('오늘은 더 넣을 시간이 없어요');break} var nid=uid(); applyOp(D,{id:nid,type:'slotAdd',at:Date.now(),d:{day:TODAY,t:nt1}}); slTimeEd=nid;
        var op1={id:nid,type:'slotAdd',at:Date.now(),d:{day:TODAY,t:nt1}}; D.pending=(D.pending||0)+1; render(); toast(nt1+' 자리를 만들었어요. 시간 바꿔도 돼요'); sendRaw(op1); break;
      case 'slPass': send('slotPass',{day:TODAY,id:b.getAttribute('data-sid')},'오늘은 패스'); break;
      case 'slStart': if(D.psession||pcBusy()){toast('이미 도는 칸이 있어요');break} var sid3=b.getAttribute('data-sid'), x3=slOf(D,TODAY).filter(function(y){return y.id===sid3})[0]; if(!x3)break;
        var tid3=x3.taskId&&D.tasks.some(function(y){return y.id===x3.taskId&&!y.done})?x3.taskId:(sugTask()||{}).id; if(!tid3){toast('할 일이 없어요. 먼저 배치해요');break}
        var s3=Date.now(); send('phoneStart',{taskId:tid3,startAt:s3,endAt:s3+SL_MIN*60000,min:SL_MIN,slotId:sid3},'50분 시작! 이 칸만 하자'); break;
      case 'medNow': var n=new Date(); send('med',{day:TODAY,time:pad(n.getHours())+':'+pad(n.getMinutes())},'약 시간 기록됨'); break;
      case 'medEdit': medEdit=true; render(); break;
      case 'medCancel': medEdit=false; render(); break;
      case 'medSave': var mt=$('medT').value; medEdit=false; send('med',{day:TODAY,time:mt||null},'약 시간 수정됨'); break;
      case 'medClear': medEdit=false; send('med',{day:TODAY,time:null},'오늘 약 기록 지움'); break;
      case 'memoAdd': memoSubmit(); break;
      case 'picDel': memoPics.splice(+b.getAttribute('data-i'),1); drawPics(); break;
      case 'panSOpen': salesOpen=!salesOpen; render(); if(salesOpen){var x=$('panIn'); if(x)x.focus()} break;
      case 'mTask': send('memoAct',{id:id,act:'task'},'할 일로 보냈어요'); break;
      case 'mLater': send('memoAct',{id:id,act:'later',tomorrow:tomorrow()},'내일 다시 보여줄게요'); break;
      case 'panM': send('pan',{day:TODAY,dm:1,ds:0},'물길 +1 · +20,000'); break;
      case 'panMm': send('pan',{day:TODAY,dm:-1,ds:0},'물길 −1'); break;
      case 'panS': var pv=Math.round(+String(($('panIn')||{}).value||'').replace(/[^0-9]/g,'')); if(!pv){$('panIn')&&$('panIn').focus();break} salesOpen=false; send('pan',{day:TODAY,dm:0,ds:pv},'매출 +'+pv.toLocaleString('ko-KR')+'원'); break;
      case 'panSm': var nv=Math.round(+String(($('panIn')||{}).value||'').replace(/[^0-9]/g,'')); if(!nv){toast('뺄 금액을 먼저 적어줘');$('panIn')&&$('panIn').focus();break} salesOpen=false; send('pan',{day:TODAY,dm:0,ds:-nv},'매출 −'+nv.toLocaleString('ko-KR')+'원'); break;
      case 'mKeep': send('memoAct',{id:id,act:'keep'},'보관함에 넣었어요'); break;
      case 'mDrop': send('memoAct',{id:id,act:'drop'}); break;
      case 'mAdd': send('missionAdd',{id:id},'할 일에 추가했어요'); break;
      case 'taskAdd': var tt=$('taskIn').value.trim(); if(!tt){$('taskIn').focus();return} var tb=$('taskB').value; send('addTask',{title:tt,brand:tb,kind:newKind},'할 일 추가됨'); setTimeout(function(){var x=$('taskIn');if(x)x.focus()},50); break;
      case 'edOpen': editId=id; startOpen=null; render(); break;
      case 'sugGo':
        var mn=+b.getAttribute('data-min'); if(D.psession||pcBusy()){toast('이미 도는 칸이 있어요');break}
        var st0=Date.now(), xs=slOf(D,TODAY).filter(function(y){return y.taskId===id&&(y.st||'wait')==='wait'&&st0>=slTs(TODAY,y.t)-15*60000})[0]; if(xs)mn=SL_MIN; pick=null; sugMin=null; send('phoneStart',{taskId:id,startAt:st0,endAt:st0+mn*60000,min:mn,slotId:xs?xs.id:''},mn+'분 시작! 이 칸만 하자'+(xs?' (고정 칸)':'')); ($('scroller')||{}).scrollTop=0; break;
      case 'sugSkip': if(pick===id)pick=null; skip.push(id); sugMin=null; render(); break;
      case 'skipReset': skip=[]; render(); break;
      case 'sugSnooze': if(pick===id)pick=null; sugMin=null; send('snooze',{id:id,tomorrow:tomorrow()},'내일 다시 보여줄게요'); break;
      case 'goalOpen': goalEdit=!goalEdit; render(); if(goalEdit){var gi=$('goalIn'); if(gi)gi.focus()} break;
      case 'goalSave': var gv=Math.round(+String(($('goalIn')||{}).value||'').replace(/[^0-9]/g,'')); if(!(gv>=10000)){toast('목표는 1만원 이상으로 적어줘');break} goalEdit=false; send('panGoal',{day:TODAY,g:gv},'오늘 목표 '+gv.toLocaleString('ko-KR')+'원'); break;
      case 'goalReset': goalEdit=false; send('panGoal',{day:TODAY,g:0},'기본 목표로 되돌렸어요'); break;
      case 'pDone': case 'pHalf':
        if(!D.psession)break; var ps0=D.psession; send('phoneFinish',{id:ps0.id,result:a==='pDone'?'done':'half',endAt:Date.now(),day:TODAY,ps:ps0},a==='pDone'?'하나 끝! 잘했어':'좋아, 반쯤도 기록했어'); break;
      case 'pCancel': if(!D.psession||!confirm('이 칸을 그만둘까요? 기록은 안 남아요.'))break; send('phoneCancel',{id:D.psession.id},'그만뒀어요'); break;
      case 'edCancel': editId=null; render(); break;
      case 'edSave': var et=$('edT').value.trim(); if(!et)return; var eb=$('edB').value, ek=$('edK').value; editId=null; send('editTask',{id:id,title:et,brand:eb,kind:ek},'수정됨'); break;
      case 'taskDel': if(!confirm('이 할 일을 삭제할까요?'))return; editId=null; send('delTask',{id:id},'삭제됨'); break;
      case 'noteSave': var nd=b.getAttribute('data-d'); send('note',{day:nd,text:$('noteIn').value.trim()},'저장됨'); break;
    }
  });
  window.__hkToast=toast;
  window.__hkUpdate=function(nd,ns){ if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
    D=nd||{}; NS=ns; D.tasks=D.tasks||[];D.blocks=D.blocks||[];D.memos=D.memos||[];D.notes=D.notes||{};D.med=D.med||{};D.session=D.session||{};
    brands=D.brands&&D.brands.length?D.brands:['기타']; if(key()!==TODAY){TODAY=key();day=TODAY} drawCompose(); render(); };
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') hkFetch(function(d,n){window.__hkUpdate(d,n)}); });
  drawCompose(); render();
}
