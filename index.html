.dot.focus{background:var(--act)}.dot.break{background:var(--done)}.dot.check{background:var(--warm)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.stats b{display:block;font-size:22px;line-height:1.1}
ul.tl{list-style:none;padding:0;margin:6px 0 0}
ul.tl li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
ul.tl li:first-child{border-top:0}
ul.tl li .grow{white-space:pre-wrap}
.tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:86px;font-size:13px;padding-top:1px}
.grow{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--act);white-space:nowrap;font-weight:600}
.tag.g{background:var(--zone);color:var(--done)}
.tag.n{background:var(--bg);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type,.small+.item{border-top:0;padding-top:4px}
.item .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.item .acts .btn{padding:8px 0;font-size:13.5px;min-height:40px}
.edit{background:var(--bg);border-radius:14px;padding:10px;margin-top:6px}
.edit input,.edit select{background:var(--surface)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav button{width:44px;height:40px;border-radius:12px;background:var(--surface);font-weight:700}
.nav .d{flex:1;text-align:center;font-weight:800;font-size:16px}
.medrow{border-top:1px solid var(--line);padding:10px 0}
.medrow:first-child{border-top:0}
details.fold>summary{list-style:none;cursor:pointer;font-weight:700;display:flex;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:'펼치기';font-size:12px;color:var(--muted);font-weight:600}
details.fold[open]>summary:after{content:'접기'}
details.fold[open]>summary{margin-bottom:8px}
/* 아래: 아이디어 입력 + 탭 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgba(0,0,0,.05);padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.compose{max-width:560px;margin:0 auto;padding:10px 16px 14px}
.compose .cb{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.compose .cb span{font-size:11.5px;color:var(--muted);font-weight:600}
.compose select{width:auto;max-width:60%;font-size:13px;padding:4px 26px 4px 10px;border-radius:99px;background:var(--bg);min-height:30px;font-weight:600}
.compose .ci{display:flex;gap:8px;align-items:flex-end}
.compose #memoIn{flex:1;min-width:0;min-height:44px;max-height:132px;resize:none;line-height:22px;overflow-y:auto;display:block}
.compose input{flex:1;min-width:0;min-height:44px}
.compose .btn{min-height:44px}
.compose .picb{display:flex;align-items:center;justify-content:center;width:46px;padding:0;font-size:20px;background:var(--bg);flex:none;cursor:pointer}
.mpics{display:flex;gap:8px;margin-top:10px}.mp{position:relative;flex:none}.mp img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}
.mp .mf{display:flex;align-items:center;height:58px;max-width:170px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.3;overflow:hidden;word-break:break-all}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fchip{display:inline-block;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;border:0;padding:0;line-height:24px;text-align:center}
nav.tabs{display:flex;max-width:560px;margin:0 auto;border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:10px 0 6px;font-weight:700;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--act)}
nav.tabs .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#E5484D;color:#fff;font-size:10.5px;line-height:17px}
.toast{position:fixed;left:50%;bottom:185px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%}
.toast.show{opacity:1}
.phs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
img.ph{width:100%;border-radius:12px;background:var(--bg);min-height:80px;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.lb img{max-width:100%;max-height:100%}
/* 오늘의 고정 칸 */
.slots{padding:14px 14px 8px}
.slots.need{box-shadow:0 0 0 2px var(--act)}
.sl-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sl-head b{font-size:15px}
.sl-need{font-size:12.5px;color:var(--act);font-weight:600;margin:0 0 6px}
.sl-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 0;border-top:1px solid var(--line)}
.sl-row:first-of-type{border-top:0}
.sl-time{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:9px;padding:5px 9px;flex:none}
.sl-body{flex:1 1 120px;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-t{font-weight:700}.sl-b{font-size:11.5px;color:var(--muted)}
.sl-hint{font-size:10.5px;color:var(--warm);font-weight:700;border:1px solid var(--warm);border-radius:99px;padding:0 6px;margin-right:4px}
.sl-pick{font-size:14px;color:var(--act);border:1.5px dashed var(--act);border-radius:9px;padding:5px 10px;font-weight:600}
.sl-act{display:flex;gap:4px;align-items:center;margin-left:auto}
.sl-st{font-size:12.5px;font-weight:700}.sl-st.ok{color:var(--done)}.sl-st.run{color:var(--act)}.sl-st.miss{color:#C62828}
.s-due .sl-time{background:var(--act);color:#fff}
.s-missed .sl-time{background:#FDE8E6;color:#C62828}
@media (prefers-color-scheme:dark){.sl-st.miss{color:#FF8A80}.s-missed .sl-time{background:#3A1A1A;color:#FF8A80}}
.s-done .sl-time{background:var(--zone);color:var(--done)}
.s-done .sl-body,.s-pass .sl-body{opacity:.6}
.sl-list{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px}
.sl-list .opt{text-align:left;background:var(--bg);border-radius:11px;padding:10px 12px;font-size:14.5px}
.tag.pin{background:var(--soft);color:var(--act)}
/* 폰 칸 타이머 */
.timer{border:2px solid var(--act)}
.timer .lbl{font-size:12.5px;color:var(--act);font-weight:700}
.timer .tt{font-size:17px;font-weight:800;margin-top:2px;word-break:keep-all}
.timer .clock{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.timer.over{border-color:var(--warm)}
.timer.over .clock{color:var(--warm)}
.btn.go{background:var(--soft);color:var(--act)}
@media (min-width:1000px){ .wrap,.compose,nav.tabs{max-width:760px} }
@media (prefers-color-scheme:dark){
  input,select,textarea,.compose select{background:#23262E}
  input:focus,select:focus,textarea:focus{background:#2A2E37}
  .panel{box-shadow:none;border:1px solid #20232B}
  .dock{background:#13151A}
  .s-missed .sl-time{background:#3A1E1E;color:#FF8A80}
  .btn{background:#272B34}
  .btn.p{background:var(--act);color:#fff}.btn.g{background:transparent}
  .btn.m{background:var(--m);color:#fff}.btn.sv{background:var(--s);color:#fff}
  .seg{background:#23262E}.seg button[aria-pressed="true"]{background:#3A3F4C;color:#fff}
  .bar{background:#23262E}
  .tag.n{background:#23262E}
  .medchip{background:#23262E}
  .edit{background:#1F2229}
}
/* 화면 틀: 위 고정 · 가운데만 스크롤 · 아래 칸은 항상 바닥 (아이폰 홈 화면 앱의 fixed 버그 피함) */
html,body{height:100vh;height:100dvh;height:var(--app-h,100dvh);overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 0!important}
#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:16px}
.dock{position:relative!important;flex:none;left:auto;right:auto;bottom:auto}
.setup-host{overflow-y:auto}
.setup{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px}
.setup h1{font-size:24px;margin:0 0 8px}.setup p{color:var(--muted);font-size:14px;margin:0 0 16px}
.setup textarea{min-height:110px;font-size:16px;background:var(--surface);border-color:var(--line)}.setup textarea:focus{border-color:var(--act)}
.setup .btn{width:100%;margin-top:12px;min-height:48px}

/* ===== 2026-11-17 리디자인 ===== */
:root{--warm:var(--act);--m:var(--act);--s:#A9B6FF}
@media (prefers-color-scheme:dark){:root{--warm:var(--act);--m:var(--act);--s:#3E4A8C}}
.decl{background:var(--soft);color:var(--ink);padding:10px 14px}
.decl .l{color:var(--act)}.decl .t{font-size:15px}
.sug{border:2px solid var(--act);box-shadow:0 6px 20px color-mix(in srgb,var(--act) 10%,transparent)}
.sug .lbl{color:var(--act);font-weight:800}
.sug .tt{font-size:24px;letter-spacing:-.5px}
body.pcbusy .sug{opacity:.55}
.grp{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 2px}
.pcbar{position:static;margin:10px auto 0;width:fit-content;background:#17231F;color:#fff;border-radius:999px;padding:10px 18px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 24px);white-space:nowrap}
.pcbar .pt{overflow:hidden;text-overflow:ellipsis}.pcbar b{font-size:16px;flex:none}
.pcbar .pd{width:8px;height:8px;border-radius:50%;background:#8494FF;flex:none}
@media (prefers-color-scheme:dark){.pcbar{background:#E6EEEA;color:#0F1412}}
/* 넓은 화면(맥북 북마크): 세 칸 */
body.wide .wrap{max-width:none;padding:14px 22px 8px}
body.wide .dock{display:none}
body.wide #scroller{padding-bottom:0}
body.wide #compose{margin:0 0 10px;padding:0;display:flex;gap:8px;align-items:center;max-width:none}
body.wide #compose .cb{flex:none;margin:0}body.wide #compose .ci{flex:1;margin:0}
body.wide .top{justify-content:flex-start;gap:18px;align-items:center}   /* 맥북 시안: 날짜·약·시동 칩을 제목 옆에 */
body.wide #compose .ci textarea{background:var(--surface);border:1px solid var(--line)}
body.wide #scroller{overflow:hidden}
body.wide .wrap{height:100%;display:flex;flex-direction:column}
body.wide #view{flex:1;min-height:0}
body.wide .wcols{height:100%;align-items:stretch}
body.wide .wc{overflow-y:auto;min-height:0;padding-right:4px}
body.wide .wcols{display:grid;grid-template-columns:440px minmax(0,1fr) 400px;gap:12px;align-items:stretch;grid-template-rows:minmax(0,1fr)}   /* 2026-11-18: start면 칸이 내용만큼 늘어나 스크롤이 안 됨 → 창 높이에 묶기 */
body.wide .wc{display:flex;flex-direction:column;gap:0;min-width:0}
body.wide .sug .tt{font-size:28px}
.tier-zero,.tier-low,.tier-mid,.tier-near,.tier-ok,.tier-over{color:var(--act)!important}
.big2 .btn.m,.big2 .btn.sv{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}

body.wide .pcbar{position:static;transform:none;display:inline-flex;margin:0 0 10px}

/* ===== 2026-11-20 넓은 화면(맥북 1440 · 본컴 2560) = 한 칸 확장 대시보드 짜임 그대로 =====
   숫자는 확장 dashboard.html·popup.html·style.css에서 그대로 가져옴. 가운데·오른쪽은 확장이 1.22배 키워 보여주는 걸 곱한 값 */
body.wide{--bg:#EDF1EE;--surface:#FFFFFF;--ink:#17231F;--muted:#5E6E68;--line:#D3DBD6;--soft:#E3E8FF;--zone:#CFE9DA;font-size:18px;line-height:1.5}
@media (prefers-color-scheme:dark){body.wide{--bg:#121816;--surface:#1B2320;--ink:#E6EEEA;--muted:#93A39C;--line:#2D3834;--act:#8494FF;--act-ink:#0E1330;--done:#52C690;--soft:#232A48;--zone:#1F3A2C}}
body.wide .wrap{padding:26px 40px 28px;gap:16px}
body.wide .wrap>*{margin-bottom:16px}
body.wide .top{margin:0;gap:12px;align-items:center;flex-wrap:wrap}
body.wide .top h1{display:none}
body.wide .top .date{font-size:30px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body.wide .top .date .dl{margin-right:4px}
body.wide .medchip{font-size:16px;font-weight:600;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:0;border-radius:99px}
body.wide .medchip.fire{background:var(--soft);border-color:color-mix(in srgb,var(--act) 30%,transparent);color:var(--act)}
body.wide .wrap{position:relative}body.wide .wrap>#view{margin-bottom:0}body.wide .sync{position:absolute;top:36px;right:40px;margin:0;font-size:14px}   /* 확장처럼 날짜 줄 한 줄만: 동기화 글씨는 오른쪽 위로 */
body.wide .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin:0;box-shadow:none}
body.wide .wtop{display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
/* 선포 */
body.wide .decl{background:var(--soft);color:var(--act);border:0;border-radius:14px;padding:12px 22px;font-size:21px;font-weight:700}
body.wide .decl .l{font-size:21px;font-weight:700}
body.wide .decl .t{font-size:21px;font-weight:700;color:var(--ink)}
/* 판: 한 줄 (확장 #panbar .pan.big) */
body.wide .wpan{border-radius:18px;padding:16px 22px}
body.wide .wpan .pt{display:flex;align-items:center;gap:22px;font-size:18px;font-weight:800}
body.wide .wpan .pt i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
body.wide .wpan .pr{margin-left:auto;font-size:20px;font-weight:800;color:var(--act)}
body.wide .wpan .pr small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
body.wide .wpan .pr button{font-size:15px;color:var(--act);text-decoration:underline;font-weight:600}
body.wide .wpan .bar{height:10px;border-radius:5px;margin:12px 0;background:var(--bg)}
body.wide .wpan .pa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.wide .wpan .pa .btn{min-height:34px;padding:4px 14px;font-size:16px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
body.wide .wpan .pa .btn.p{background:var(--act);color:var(--act-ink);border-color:var(--act)}
body.wide .wpan .pa input{width:200px;flex:none;font-size:16px;min-height:34px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
body.wide .wpan .lunch{margin-top:12px}
@media (min-width:2300px){body.wide .wpan{display:flex;align-items:center;flex-wrap:wrap;column-gap:22px;row-gap:12px}
  body.wide .wpan .pt{display:contents}body.wide .wpan .bar{order:3;flex:1;min-width:300px;margin:0}body.wide .wpan .pr{order:4;margin:0}body.wide .wpan .pa{order:5;flex-wrap:nowrap}body.wide .wpan .lunch,body.wide .wpan .salesin{order:9;flex-basis:100%}}
/* 아이디어 칸: [적는 칸][사진][분류][적기] */
body.wide #compose{display:flex;gap:10px;align-items:stretch;margin:0 0 16px;padding:0;max-width:none}
body.wide #compose .cb,body.wide #compose .ci{display:contents}
body.wide #compose .cb span{display:none}
body.wide #compose #memoIn{order:1;flex:1;font-size:18px;min-height:56px;line-height:26px;padding:14px 16px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px}
body.wide #compose .picb{order:2;width:56px;min-height:56px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
body.wide #compose select{order:3;max-width:200px;min-height:56px;font-size:16px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);padding:0 34px 0 16px}
body.wide #compose [data-a="memoAdd"]{order:4;min-height:56px;font-size:18px;padding:0 28px;border-radius:12px}
body.wide #compose .mpics{order:5;flex-basis:100%}body.wide #compose .mpics[hidden]{display:none}body.wide #compose{flex-wrap:wrap}
/* 오늘 하루 띠 (확장과 같은 값) */
body.wide .wtlbox{margin-bottom:22px}
body.wide .wtlh{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:16px;color:var(--muted)}
body.wide .wtlh b{font-size:18px;color:var(--ink)}
body.wide .wtlh .wpl{font-size:14px;padding:1px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:600}
body.wide .wtlh .grow{flex:1}
body.wide .wtlh .wlg{display:flex;align-items:center;gap:6px;font-size:14px}.wtlh .wlg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-left:8px}
body.wide .wtlh .wlg .l1{background:var(--done)}body.wide .wtlh .wlg .l2{background:#8FA59B}body.wide .wtlh .wlg .l3{border:2px dashed var(--act)}body.wide .wtlh .wlg .l4{background:color-mix(in srgb,var(--act) 14%,transparent)}
body.wide .wticks{position:relative;height:22px;margin:0 0 4px;font-size:13px;color:var(--muted)}
body.wide .wticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
body.wide .wticks span:first-child{transform:none}body.wide .wticks span:last-child{transform:translateX(-100%)}body.wide .wticks span.hid{visibility:hidden}
body.wide .wtl{position:relative;height:28px}
body.wide .wtl::before{content:'';position:absolute;left:0;right:0;top:13px;border-top:2px dotted var(--line)}
body.wide .wtl i{position:absolute;top:8px;height:12px;border-radius:6px;background:var(--done)}
body.wide .wtl i.half{background:#8FA59B}body.wide .wtl i.cur{background:var(--act)}
body.wide .wtl .wslot{position:absolute;top:8px;height:12px;border-radius:6px;border:2px dashed var(--act)}
body.wide .wtl .wslot.miss{border-color:var(--muted)}
body.wide .wtl .wnow{position:absolute;width:2px;top:-2px;bottom:-2px;background:var(--ink);z-index:2}
body.wide .wtl .wnow span{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;background:var(--ink);color:var(--bg);padding:1px 7px;border-radius:6px;white-space:nowrap}
body.wide .wtllab{display:flex;flex-wrap:wrap;gap:10px 32px;margin-top:10px}
body.wide .wtllab .wlb{position:relative;white-space:nowrap;line-height:1.25;padding-left:16px}
body.wide .wtllab .wlb::before{content:'';position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:5px;background:var(--done)}
body.wide .wtllab .wlb.h::before{background:#8FA59B}body.wide .wtllab .wlb.slot::before{background:transparent;border:2px dashed var(--act)}body.wide .wtllab .wlb.slot.miss::before{border-color:var(--muted)}body.wide .wtllab .wlb.cur::before{background:var(--act)}
body.wide .wtllab .wlb b{display:block;font-size:15px;font-weight:700;color:var(--ink)}
